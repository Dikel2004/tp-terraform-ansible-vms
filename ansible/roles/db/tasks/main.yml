---
- name: Installer MariaDB
  ansible.builtin.apt:
    name: mariadb-server
    state: present

- name: Demarrer et activer MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Creer le dossier des sauvegardes
  ansible.builtin.file:
    path: /var/backups
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ajouter un cron de sauvegarde MariaDB
  ansible.builtin.cron:
    name: "Sauvegarde quotidienne MariaDB"
    minute: "0"
    hour: "2"
    user: root
    job: "mysqldump --all-databases > {{ db_backup_file }}"
