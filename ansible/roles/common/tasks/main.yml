---
- name: Mettre a jour le cache des paquets
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets utiles
  ansible.builtin.apt:
    name:
      - curl
      - openssl
      - vim
      - ufw
    state: present

- name: Creer l'utilisateur deploy
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Autoriser deploy a utiliser sudo sans mot de passe
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Autoriser les ports necessaires
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ allowed_ports }}"

- name: Activer le pare-feu
  community.general.ufw:
    state: enabled
    policy: deny
