services:
  db:
    image: mariadb:11.4
    container_name: tp-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: tp_database
      MARIADB_USER: deploy
      MARIADB_PASSWORD: deploypassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      tp_network:
        ipv4_address: 172.30.0.20

  web:
    image: nginx:1.27-alpine
    container_name: tp-web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: "172.30.0.20"
      DB_NAME: tp_database
    command: >
      /bin/sh -c "envsubst '$$DB_HOST $$DB_NAME' < /etc/nginx/templates/index.html.template
      > /usr/share/nginx/html/index.html
      && nginx -g 'daemon off;'"
    volumes:
      - ./docker/web/index.html.template:/etc/nginx/templates/index.html.template:ro
    networks:
      tp_network:
        ipv4_address: 172.30.0.10

networks:
  tp_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db_data:
