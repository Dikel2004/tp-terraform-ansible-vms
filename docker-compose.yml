services:
  db:
    image: mariadb:11.4
    container_name: tp-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: tp_database
      MARIADB_USER: deploy
      MARIADB_PASSWORD: deploypassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      tp_network:
        ipv4_address: 172.30.0.20

  web:
    image: nginx:1.27-alpine
    container_name: tp-web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: "172.30.0.20"
      DB_NAME: tp_database
    command: >
      /bin/sh -c "envsubst '$$DB_HOST $$DB_NAME' < /etc/nginx/templates/index.html.template
      > /usr/share/nginx/html/index.html
      && nginx -g 'daemon off;'"
    volumes:
      - ./docker/web/index.html.template:/etc/nginx/templates/index.html.template:ro
    networks:
      tp_network:
        ipv4_address: 172.30.0.10

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tp-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      tp_network:
        ipv4_address: 172.30.0.30

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tp-prometheus
    restart: unless-stopped
    depends_on:
      - cadvisor
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      tp_network:
        ipv4_address: 172.30.0.40

  grafana:
    image: grafana/grafana:11.3.1
    container_name: tp-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      tp_network:
        ipv4_address: 172.30.0.50

networks:
  tp_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db_data:
  prometheus_data:
  grafana_data:
